name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build (release)
        working-directory: rust-version
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --target x86_64-pc-windows-gnu 2>&1 | tee build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: rust-version/build.log

      - name: Dump build log as annotations (on failure)
        if: failure()
        working-directory: rust-version
        shell: bash
        run: |
          if [ -f build.log ]; then
            tail -30 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "::error::build.log introuvable"
          fi

      - name: Publish release with exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rust-version/target/x86_64-pc-windows-gnu/release/notepad.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
